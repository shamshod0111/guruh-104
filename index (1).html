  .masthead .crest,
  .masthead .eyebrow,
  .masthead h1,
  .masthead .subtitle{
    position:relative;
    z-index:1;
  }
  .masthead .crest{
    background:rgba(255,253,248,0.92);
    backdrop-filter:blur(2px);
  }
  .masthead .eyebrow{ color:var(--gold-soft); }
  .masthead h1{ color:#fff; text-shadow:0 1px 8px rgba(0,0,0,0.25); }
  .masthead .subtitle{ color:rgba(255,255,255,0.85); }
  .crest{
    width:56px;height:56px;
    border:1.5px solid var(--ink);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:20px;
    color:var(--ink);
    margin-bottom:14px;
    position:relative;
  }
  .crest::after{
    content:'';
    position:absolute;
    inset:-6px;
    border:1px solid var(--gold-soft);
    border-radius:50%;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    line-height:1.15;
    margin:0 0 4px;
    color:var(--ink);
  }
  .subtitle{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
  }

  /* ---- Tabs ---- */
  .tabs{
    display:flex;
    gap:4px;
    padding:14px 20px 0;
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:5;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 8px 12px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .2s ease, border-color .2s ease;
    user-select:none;
  }
  .tab.active{
    color:var(--ink);
    border-color:var(--gold);
  }

  main{padding:18px 20px 0;}
  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .section-label{
    font-family:'Fraunces',serif;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    margin:4px 0 12px;
  }

  /* ---- Achievements: register rows ---- */
  .register{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .row{
    display:flex;
    gap:14px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .row:last-child{border-bottom:none;}
  .row::before{
    content:'';
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:var(--gold-soft);
  }
  .row-num{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--gold);
    min-width:22px;
    padding-top:1px;
  }
  .row-body{flex:1;}
  .row-title{
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
    margin-bottom:3px;
  }
  .row-meta{
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .pill{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
    background:rgba(46,110,104,0.10);
    color:var(--teal);
    white-space:nowrap;
  }

  /* ---- Leaderboard ---- */
  .board{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .brow{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .brow:last-child{border-bottom:none;}
  .rank{
    width:28px;height:28px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:13px;
    flex-shrink:0;
    background:#EFE9DA;
    color:var(--ink-soft);
  }
  .rank.r1{background:var(--gold); color:#fff;}
  .rank.r2{background:var(--silver); color:#fff;}
  .rank.r3{background:var(--bronze); color:#fff;}
  .bname{
    flex:1;
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
  }
  .bpts{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--teal);
  }
  .bpts span{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-left:3px;
  }

  .empty{
    text-align:center;
    padding:36px 20px;
    color:var(--ink-soft);
    font-size:13.5px;
  }

  footer{
    text-align:center;
    padding:26px 20px 6px;
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:.02em;
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="crest">104</div>
  <div class="eyebrow">Qorako'l akademik litsey</div>
  <h1>104-guruh</h1>
  <p class="subtitle">Yutuqlar va o'quvchilar reytingi</p>
</div>

<div class="tabs">
  <div class="tab active" data-tab="achievements">Yutuqlar</div>
  <div class="tab" data-tab="leaderboard">Reyting</div>
</div>

<main>
  <section class="panel active" id="panel-achievements">
    <p class="section-label">So'nggi yutuqlar</p>
    <div class="register" id="achievements-list"></div>
  </section>

  <section class="panel" id="panel-leaderboard">
    <p class="section-label">O'quvchilar reytingi</p>
    <div class="board" id="leaderboard-list"></div>
  </section>
</main>

<footer>104-guruh mini app · Qorako'l akademik litsey</footer>

<script>
  // ====== MA'LUMOTLARNI SHU YERDA TAHRIRLANG ======
  // Har bir yutuq: sarlavha, o'quvchi ismi, sana, toifa
  const ACHIEVEMENTS = [
    // Bu yerga yutuqlarni qo'shing, masalan:
    // { title: "Matematika fanidan viloyat olimpiadasi — 1-o'rin", student: "Ism Familiya", date: "Mart 2026", tag: "Olimpiada" },
  ];

  // Har bir o'quvchi: ismi, ball
  const LEADERBOARD = [
    // Bu yerga o'quvchilarni qo'shing, masalan:
    // { name: "Ism Familiya", points: 100 },
  ];
  // ================================================

  function renderAchievements(){
    const list = document.getElementById('achievements-list');
    if(!ACHIEVEMENTS.length){
      list.innerHTML = '<div class="empty">Yutuqlar ro\'yxati hali kiritilmagan.</div>';
      return;
    }
    list.innerHTML = ACHIEVEMENTS.map((a,i)=>`
      <div class="row">
        <div class="row-num">${String(i+1).padStart(2,'0')}</div>
        <div class="row-body">
          <div class="row-title">${a.title}</div>
          <div class="row-meta">
            <span>${a.student}</span>
            <span>·</span>
            <span>${a.date}</span>
            <span class="pill">${a.tag}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderLeaderboard(){
    const list = document.getElementById('leaderboard-list');
    const sorted = [...LEADERBOARD].sort((a,b)=>b.points-a.points);
    if(!sorted.length){
      list.innerHTML = '<div class="empty">Reyting ro\'yxati hali kiritilmagan.</div>';
      return;
    }
    list.innerHTML = sorted.map((s,i)=>{
      const rankClass = i===0?'r1':i===1?'r2':i===2?'r3':'';
      return `
      <div class="brow">
        <div class="rank ${rankClass}">${i+1}</div>
        <div class="bname">${s.name}</div>
        <div class="bpts">${s.points}<span>ball</span></div>
      </div>`;
    }).join('');
  }

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      if(window.Telegram?.WebApp?.HapticFeedback){
        window.Telegram.WebApp.HapticFeedback.selectionChanged();
      }
    });
  });

  renderAchievements();
  renderLeaderboard();

  // ====== Telegram WebApp integratsiyasi ======
  if(window.Telegram && window.Telegram.WebApp){
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
  }
</script>
</body>
</html>
